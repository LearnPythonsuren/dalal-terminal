<title>Dalal Terminal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* ============================================================
   Layout concept: fixed left icon rail + top ticker bar;
   a dense, dark trading-terminal canvas that swaps panels.
   ============================================================ */
:root{
  /* Terminal Midnight — committed dark terminal palette */
  --bg:#0a0e17; --panel:#131722; --panel-2:#171c28; --raised:#1c2230;
  --border:#252b38; --border-2:#2f3542;
  --fg:#d1d4dc; --muted:#848b9c; --faint:#5a6172;
  --accent:#2f6bff; --accent-2:#22d3ee;
  --up:#16c784; --up-bg:rgba(22,199,132,.14); --up-dim:#0e8a5a;
  --down:#ea3943; --down-bg:rgba(234,57,67,.14); --down-dim:#b02a32;
  --warn:#f0b90b; --flat:#363c4a;
  /* heatmap diverging ramp */
  --hm-u1:#132d24; --hm-u2:#14432f; --hm-u3:#12623f; --hm-u4:#0f8a50; --hm-u5:#16c784;
  --hm-d1:#2e1a1d; --hm-d2:#4a1f24; --hm-d3:#6e262d; --hm-d4:#a52e37; --hm-d5:#ea3943;
  --font-ui:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
  --rail:58px; --topbar:40px; --ticker:30px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--font-ui);font-size:13px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:100%;height:100%}
#rail{
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);
  padding-left:env(safe-area-inset-left,0px);
}
.brand{width:34px;height:34px;border-radius:8px;margin-bottom:10px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;font-weight:700;color:#071018;font-size:16px;
  font-family:var(--font-mono)}
.nav-btn{width:44px;height:44px;border:0;background:transparent;border-radius:9px;
  display:grid;place-items:center;color:var(--muted);position:relative;transition:.12s}
.nav-btn:hover{background:var(--raised);color:var(--fg)}
.nav-btn.on{background:var(--raised);color:var(--accent-2)}
.nav-btn.on::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:3px;
  border-radius:2px;background:var(--accent-2)}
.nav-btn svg{width:20px;height:20px}
.nav-btn .lbl{position:absolute;left:52px;white-space:nowrap;background:var(--raised);
  border:1px solid var(--border-2);padding:3px 8px;border-radius:6px;font-size:11px;
  opacity:0;pointer-events:none;transform:translateX(-4px);transition:.12s;z-index:40}
.nav-btn:hover .lbl{opacity:1;transform:none}
.rail-sp{flex:1}

#main{display:grid;grid-template-rows:var(--topbar) var(--ticker) 1fr;min-width:0;min-height:0}

/* top bar */
#topbar{display:flex;align-items:center;gap:14px;background:var(--panel);
  border-bottom:1px solid var(--border);padding:0 14px;
  padding-top:env(safe-area-inset-top,0px);
  padding-right:max(14px,env(safe-area-inset-right,0px))}
#topbar .title{font-weight:600;font-size:13px;letter-spacing:.2px}
#topbar .title b{color:var(--accent-2)}
#topbar .seg{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;
  border:1px solid var(--border-2);border-radius:5px;padding:2px 7px}
#clock{margin-left:auto;font-size:11px;color:var(--muted)}
.status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.live{background:var(--up);box-shadow:0 0 8px var(--up)}
.dot.err{background:var(--down);box-shadow:0 0 8px var(--down)}
.icon-btn{width:30px;height:30px;border:1px solid var(--border-2);background:var(--raised);
  border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--fg);border-color:var(--faint)}
.icon-btn svg{width:15px;height:15px}

/* ticker */
#ticker{background:var(--panel-2);border-bottom:1px solid var(--border);overflow:hidden;
  display:flex;align-items:center;position:relative}
#ticker .track{display:flex;gap:26px;padding:0 14px;white-space:nowrap;will-change:transform;
  animation:scroll 48s linear infinite}
#ticker:hover .track{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{display:inline-flex;align-items:center;gap:7px;font-size:12px}
.tk .nm{color:var(--muted);font-size:11px;letter-spacing:.3px}
.tk .px{font-family:var(--font-mono)}
.tk .ch{font-family:var(--font-mono);font-size:11px}
@media (prefers-reduced-motion:reduce){#ticker .track{animation:none}}

/* view area */
#view{min-width:0;min-height:0;overflow:auto;position:relative}
.panel{padding:14px;padding-left:max(14px,env(safe-area-inset-left,0px));
  padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}

/* controls row */
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.ctrl{display:flex;flex-direction:column;gap:3px}
.ctrl > span{font-size:9px;text-transform:uppercase;letter-spacing:.9px;color:var(--faint);padding-left:2px}
.segbar{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}
.segbar button{border:0;background:transparent;color:var(--muted);font-size:11.5px;
  padding:5px 10px;border-radius:6px;white-space:nowrap}
.segbar button.on{background:var(--raised);color:var(--fg)}
.segbar button:hover:not(.on){color:var(--fg)}
.spacer{flex:1}
.mini-btn{border:1px solid var(--border-2);background:var(--panel);color:var(--muted);
  border-radius:7px;padding:6px 10px;font-size:11.5px;display:inline-flex;align-items:center;gap:6px}
.mini-btn:hover{color:var(--fg);border-color:var(--faint)}
.mini-btn.on{color:var(--accent-2);border-color:var(--accent)}
.mini-btn svg{width:13px;height:13px}

/* section headers */
.hd{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.hd h2{font-size:13px;font-weight:600;margin:0;letter-spacing:.2px}
.hd .sub{font-size:11px;color:var(--muted)}
.hd .ln{flex:1;height:1px;background:var(--border)}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.stat .v{font-family:var(--font-mono);font-size:19px;margin-top:3px}
.stat .d{font-size:11px;font-family:var(--font-mono);margin-top:2px}

/* breadth bar */
.breadth{height:8px;border-radius:5px;overflow:hidden;display:flex;background:var(--flat);margin-top:7px}
.breadth i{display:block;height:100%}

/* ---------- HEATMAP ---------- */
#heatmap{display:flex;flex-direction:column;gap:14px}
.sector{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.sector-hd{display:flex;align-items:baseline;gap:10px;padding:8px 11px;border-bottom:1px solid var(--border);
  background:var(--panel-2)}
.sector-hd .nm{font-size:12px;font-weight:600}
.sector-hd .ch{font-family:var(--font-mono);font-size:11.5px;margin-left:auto}
.sector-hd .ct{font-size:10px;color:var(--faint)}
.tiles{position:relative;width:100%}
.tile{position:absolute;overflow:hidden;border:1px solid rgba(10,14,23,.6);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:3px;text-align:center;transition:filter .1s;cursor:default}
.tile:hover{filter:brightness(1.18);z-index:5}
.tile .sym{font-weight:600;line-height:1.1;letter-spacing:-.2px}
.tile .pc{font-family:var(--font-mono);line-height:1.1;opacity:.95}
.tile.sm .pc{display:none}
.hm-legend{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--muted)}
.hm-legend i{width:16px;height:11px;border-radius:2px;display:inline-block}

/* movers */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
.list{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.list .lh{padding:8px 11px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;align-items:center;gap:7px}
.row{display:flex;align-items:center;gap:9px;padding:7px 11px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel-2)}
.row .sym{font-weight:600;font-size:12px;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .px{font-family:var(--font-mono);font-size:12px}
.row .ch{font-family:var(--font-mono);font-size:11.5px;min-width:64px;text-align:right}
.pill{font-size:10px;font-family:var(--font-mono);padding:1px 6px;border-radius:4px}
.pill.u{background:var(--up-bg);color:var(--up)} .pill.d{background:var(--down-bg);color:var(--down)}

/* generic table */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);
  font-weight:500;padding:8px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border)}
.tbl td.n{font-family:var(--font-mono);text-align:right}
.tbl tr:hover,.tbl tbody tr:hover{background:var(--panel-2)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--panel)}

/* search */
.search{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search input{background:var(--panel);border:1px solid var(--border-2);border-radius:8px;
  color:var(--fg);padding:8px 11px;font-size:13px;min-width:200px;flex:1;max-width:360px}
.search input:focus{outline:none;border-color:var(--accent)}
.search .go{background:var(--accent);border:0;color:#fff;border-radius:8px;padding:8px 16px;font-weight:600;font-size:12px}
.search .go:hover{filter:brightness(1.1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:4px 11px;
  font-size:11px;color:var(--muted)}
.chip:hover{color:var(--fg);border-color:var(--faint)}

/* fundamentals grid */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.fcard{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
.fcard .k{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.fcard .v{font-family:var(--font-mono);font-size:17px;margin-top:4px}
.fcard .x{font-size:10px;color:var(--faint);margin-top:1px}

/* company head */
.chead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;background:var(--panel);
  border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.chead .big{font-size:22px;font-weight:600}
.chead .tick{font-family:var(--font-mono);color:var(--muted);font-size:12px}
.chead .lp{font-family:var(--font-mono);font-size:26px;margin-left:auto}
.chead .lc{font-family:var(--font-mono);font-size:14px}
.tag{font-size:10px;padding:2px 8px;border-radius:5px;background:var(--raised);color:var(--muted);
  border:1px solid var(--border-2)}

/* IPO cards */
.ipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ipo{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:13px;display:flex;flex-direction:column;gap:9px}
.ipo .top{display:flex;align-items:flex-start;gap:8px}
.ipo .nm{font-weight:600;font-size:13px;flex:1;min-width:0}
.ipo .st{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;padding:2px 7px;border-radius:5px;white-space:nowrap}
.st.open{background:var(--up-bg);color:var(--up)}
.st.upcoming{background:rgba(47,107,255,.14);color:var(--accent-2)}
.st.closed{background:var(--raised);color:var(--muted)}
.st.listed{background:rgba(240,185,11,.14);color:var(--warn)}
.ipo .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:11px}
.ipo .meta .k{color:var(--faint);font-size:9.5px;text-transform:uppercase;letter-spacing:.5px}
.ipo .meta .v{font-family:var(--font-mono)}
.subbar{margin-top:2px}
.subbar .lab{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:3px}
.subbar .bar{height:6px;background:var(--flat);border-radius:4px;overflow:hidden}
.subbar .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}

/* news */
.feed{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.news{background:var(--panel);padding:10px 12px;display:flex;gap:11px;align-items:flex-start}
.news:hover{background:var(--panel-2)}
.news .tm{font-family:var(--font-mono);font-size:10px;color:var(--faint);white-space:nowrap;min-width:52px;padding-top:1px}
.news .bd{min-width:0;flex:1}
.news .hl{font-size:12.5px;line-height:1.4}
.news .mt{display:flex;gap:7px;align-items:center;margin-top:4px;flex-wrap:wrap}
.news .sy{font-family:var(--font-mono);font-size:10px;color:var(--accent-2);font-weight:600}
.news .cat{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);
  border:1px solid var(--border-2);border-radius:4px;padding:0 5px}

/* settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.set-card{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:14px;display:flex;flex-direction:column;gap:10px}
.set-card .sh{display:flex;align-items:center;gap:9px}
.set-card .sh .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.set-card .sh .nm{font-weight:600;font-size:13px}
.set-card .sh .ds{font-size:10.5px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint)}
.field input{background:var(--bg);border:1px solid var(--border-2);border-radius:7px;color:var(--fg);
  padding:7px 10px;font-size:12px;font-family:var(--font-mono)}
.field input:focus{outline:none;border-color:var(--accent)}
.set-row{display:flex;gap:8px;align-items:center}
.test-btn{border:1px solid var(--border-2);background:var(--raised);border-radius:7px;color:var(--muted);
  padding:6px 12px;font-size:11px;display:inline-flex;align-items:center;gap:6px}
.test-btn:hover{color:var(--fg)}
.test-res{font-size:11px;font-family:var(--font-mono)}
.save-bar{position:sticky;bottom:0;margin-top:14px;display:flex;gap:10px;align-items:center;
  background:linear-gradient(to top,var(--bg) 60%,transparent);padding:12px 0 2px}
.save-btn{background:var(--accent);border:0;color:#fff;border-radius:8px;padding:9px 20px;font-weight:600;font-size:13px}
.save-btn:hover{filter:brightness(1.1)}
.ghost-btn{background:transparent;border:1px solid var(--border-2);color:var(--muted);border-radius:8px;padding:9px 16px;font-size:12px}
.ghost-btn:hover{color:var(--fg)}
.note{font-size:11px;color:var(--muted);line-height:1.6}
.note code{font-family:var(--font-mono);background:var(--raised);padding:1px 5px;border-radius:4px;color:var(--accent-2);font-size:11px}

/* banner */
.banner{display:flex;align-items:center;gap:10px;background:rgba(240,185,11,.08);
  border:1px solid rgba(240,185,11,.3);border-radius:9px;padding:9px 12px;margin-bottom:12px;font-size:11.5px;color:#e8c14e}
.banner svg{width:16px;height:16px;flex:none}
.banner b{color:var(--warn)}
.banner a{color:var(--accent-2);cursor:pointer;text-decoration:underline}

/* loading */
.load{display:flex;align-items:center;justify-content:center;gap:9px;padding:40px;color:var(--muted);font-size:12px}
.spin{width:15px;height:15px;border:2px solid var(--border-2);border-top-color:var(--accent-2);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:40px 14px;text-align:center;color:var(--faint);font-size:12px}

/* responsive */
@media(max-width:640px){
  :root{--rail:0px}
  #rail{position:fixed;bottom:0;left:0;right:0;top:auto;flex-direction:row;height:52px;z-index:50;
    border-right:0;border-top:1px solid var(--border);justify-content:space-around;padding-top:0;
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .brand{display:none}
  .nav-btn .lbl{display:none}
  #app{grid-template-columns:1fr}
  #view{padding-bottom:56px}
  .chead .lp{margin-left:0;width:100%}
  .cols{grid-template-columns:1fr}
}
.sparkwrap{height:40px;margin-top:6px}
svg.spark{width:100%;height:40px;display:block}
</style>

  </nav>

  <div id="main">
    <header id="topbar">

function loadCfg(){
  let base={};

  const cfg={apis:{},prefs:Object.assign({exchange:"NSE",universe:"NIFTY50",segment:"CASH",refresh:30,autorefresh:false},base.prefs||{})};
  API_DEFS.forEach(d=>{cfg.apis[d.id]=Object.assign({base:DEFAULT_BASE,token:""},(base.apis||{})[d.id]||{})});
  return cfg;
}

/* ============================================================
   API layer — resilient GFDL REST caller + normaliser.
   Inside a published artifact, cross-origin fetch is blocked by
   CSP, so these throw and we fall back to sample data. Run the
   downloaded file locally / self-hosted to hit live endpoints.
   ============================================================ */
function proxied(u){
  // Served over http(s) (the Render deployment): route GFDL calls through the
  // same-origin /api proxy to avoid browser CORS. Opened as a local file://,
  // call the endpoint directly (your gateway must allow it, or use the deploy).
  try{ if(location.protocol==="http:"||location.protocol==="https:") return "/api?u="+encodeURIComponent(u); }catch(e){}
  return u;
}
async function gfdl(api,fn,params){
  const c=CFG.apis[api]; if(!c||!c.base) throw new Error("no endpoint");
  const qs=new URLSearchParams(Object.assign({},params,{accesstoken:c.token||""})).toString();
  const url=c.base.replace(/\/+$/,"")+"/"+fn+"/?"+qs;
  const r=await fetch(proxied(url),{mode:"cors"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const txt=await r.text();
  return normalise(txt);
}
function normalise(txt){
  // GFDL may return a JSON object, an array, {result:[...]}, or
  // newline/space concatenated JSON objects. Handle all.
  txt=(txt||"").trim();
  if(!txt) return [];
  try{const j=JSON.parse(txt);
    if(Array.isArray(j))return j;
    if(j&&Array.isArray(j.result))return j.result;
    if(j&&j.RESULT&&Array.isArray(j.RESULT))return j.RESULT;
    return [j];
  }catch(e){}
  // concatenated objects: }{ -> }\n{
  const parts=txt.replace(/}\s*{/g,"}\n{").split("\n");
  const out=[];for(const p of parts){try{out.push(JSON.parse(p))}catch(e){}}
  return out;
}

/* ============================================================
   number / format helpers
   ============================================================ */
const fmt=(n,d=2)=>n==null||isNaN(n)?"—":Number(n).toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmt0=n=>n==null||isNaN(n)?"—":Math.round(n).toLocaleString("en-IN");
const sign=n=>(n>0?"+":"")+fmt(n,2);
const pcCls=n=>n>0.0001?"up":n<-0.0001?"down":"flat";
function crFromValue(v){return v/1e7;} // rupees -> ₹Cr
function compactCr(cr){ if(cr>=1e5)return "₹"+fmt(cr/1e5,2)+"L Cr"; if(cr>=1e3)return "₹"+fmt(cr/1e3,1)+"K Cr"; return "₹"+fmt0(cr)+" Cr";}
function volCompact(v){ if(v>=1e7)return fmt(v/1e7,2)+" Cr"; if(v>=1e5)return fmt(v/1e5,2)+" L"; if(v>=1e3)return fmt(v/1e3,1)+"K"; return fmt0(v);}

/* heatmap color from a % value with a diverging ramp */
function hmColor(pc,metric){
  // normalise: for change use ±3% range; for vol/turnover use rank-based 0..1 upside
  let t;
  if(metric==="change"){ t=Math.max(-1,Math.min(1,pc/3)); }
  else { t=Math.max(-1,Math.min(1,pc)); } // pre-normalised rank score -1..1
  const up=["--hm-u1","--hm-u2","--hm-u3","--hm-u4","--hm-u5"];
  const dn=["--hm-d1","--hm-d2","--hm-d3","--hm-d4","--hm-d5"];
  const cs=getComputedStyle(document.documentElement);
  if(Math.abs(t)<0.04) return cs.getPropertyValue("--flat").trim();
  const idx=Math.min(4,Math.floor(Math.abs(t)*5));
  return cs.getPropertyValue((t>0?up:dn)[idx]).trim();
}
function textOn(pc){ return Math.abs(pc)>1.2?"#ffffff":"#e6e9ef"; }

/* ============================================================
   squarified treemap (for heat-map tiles sized by weight)
   ============================================================ */
function squarify(items,x,y,w,h){
  // items: [{weight, ...}] -> assigns .rect {x,y,w,h}
  const total=items.reduce((s,i)=>s+Math.max(i.weight,1e-9),0);
  const scaled=items.map(i=>({ref:i,area:Math.max(i.weight,1e-9)/total*w*h}));
  let rx=x,ry=y,rw=w,rh=h;
  function worst(row,len){
    const s=row.reduce((a,b)=>a+b.area,0);
    const mx=Math.max(...row.map(r=>r.area)),mn=Math.min(...row.map(r=>r.area));
    const l2=len*len,s2=s*s;
    return Math.max(l2*mx/s2,s2/(l2*mn));
  }
  function layoutRow(row,len,horiz){
    const s=row.reduce((a,b)=>a+b.area,0);
    let off=horiz?ry:rx;
    const thick=s/len;
    row.forEach(r=>{
      const side=r.area/thick;
      if(horiz){ r.ref.rect={x:rx,y:off,w:thick,h:side}; off+=side; }
      else { r.ref.rect={x:off,y:ry,w:side,h:thick}; off+=side; }
    });
    if(horiz){ rx+=thick; rw-=thick; } else { ry+=thick; rh-=thick; }
  }
  let i=0;
  while(i<scaled.length){
    const horiz=rw<rh? false : true; // choose shorter side
    const len=horiz?rh:rw;
    let row=[scaled[i]]; i++;
    while(i<scaled.length){
      const test=row.concat([scaled[i]]);
      if(worst(row,len)>=worst(test,len)){ row=test; i++; }
      else break;
    }
    layoutRow(row,len,horiz);
  }
}

function buildUniverseRows(){
  // returns flat [{sym,sector,px,dch,m1,m5,vol,tov,mcap}]
  const rows=[];
  for(const [sector,arr] of Object.entries(SAMPLE_UNIVERSE)){
    arr.forEach(r=>{
      const [sym,px,dch,m1,m5,vol,tov,mcap]=r;
      rows.push({sym,sector,px,dch,m1,m5,vol,tov,mcap});
    });
  }
  // universe filter by size (NIFTY50 ~ top 50 by mcap, 100, 500)
  rows.sort((a,b)=>b.mcap-a.mcap);
  const n=state.hm.universe==="NIFTY50"?50:state.hm.universe==="NIFTY100"?100:500;
  return rows.slice(0,Math.min(n,rows.length));
}
function metricValue(r){
  const tf=state.hm.tf;
  if(state.hm.color==="change") return tf==="1min"?r.m1:tf==="5min"?r.m5:r.dch;
  if(state.hm.color==="volume") return r.vol;
  return r.tov;
}
function sizeWeight(r){
  if(state.hm.size==="equal") return 1;
  return Math.max(r.mcap,1);
}
function renderHeatmap(){
  const rows=buildUniverseRows();
  // breadth
  const adv=rows.filter(r=>(state.hm.tf==="1min"?r.m1:state.hm.tf==="5min"?r.m5:r.dch)>0).length;
  const dec=rows.filter(r=>(state.hm.tf==="1min"?r.m1:state.hm.tf==="5min"?r.m5:r.dch)<0).length;
  const unch=rows.length-adv-dec;
  // for vol/turnover coloring, compute rank score -1..1 centered
  let colorScore;
  if(state.hm.color==="change"){ colorScore=r=>metricValue(r); }
  else {
    const vals=rows.map(metricValue).sort((a,b)=>a-b);
    const med=vals[Math.floor(vals.length/2)];
    const max=vals[vals.length-1]||1;
    colorScore=r=>{ const v=metricValue(r); return (v-med)/(max-med||1); }; // ~0..1, dir from sign of daily
  }
  const tfLabel={daily:"Daily",["1min"]:"1-min",["5min"]:"5-min"}[state.hm.tf];
  const colorLabel={change:"% Change",volume:"Volume",turnover:"Turnover"}[state.hm.color];

  let html=`
  ${sampleBanner("Heat map")}
  <div class="ctrls">
    <div class="ctrl"><span>Universe</span>
      <div class="segbar" data-group="universe">
        <button data-v="NIFTY50" class="${state.hm.universe==="NIFTY50"?"on":""}">NIFTY 50</button>
        <button data-v="NIFTY100" class="${state.hm.universe==="NIFTY100"?"on":""}">NIFTY 100</button>
        <button data-v="NIFTY500" class="${state.hm.universe==="NIFTY500"?"on":""}">NIFTY 500</button>
      </div></div>
    <div class="ctrl"><span>Segment</span>
      <div class="segbar" data-group="segment">
        <button data-v="CASH" class="${state.hm.segment==="CASH"?"on":""}">NSE Cash</button>
        <button data-v="FO" class="${state.hm.segment==="FO"?"on":""}">F&amp;O</button>
      </div></div>
    <div class="ctrl"><span>Colour by</span>
      <div class="segbar" data-group="color">
        <button data-v="change" class="${state.hm.color==="change"?"on":""}">% Change</button>
        <button data-v="volume" class="${state.hm.color==="volume"?"on":""}">Volume</button>
        <button data-v="turnover" class="${state.hm.color==="turnover"?"on":""}">Turnover</button>
      </div></div>
    <div class="ctrl"><span>Size by</span>
      <div class="segbar" data-group="size">
        <button data-v="mcap" class="${state.hm.size==="mcap"?"on":""}">Market cap</button>
        <button data-v="equal" class="${state.hm.size==="equal"?"on":""}">Equal</button>
      </div></div>
    <div class="ctrl"><span>Timeframe</span>
      <div class="segbar" data-group="tf">
        <button data-v="1min" class="${state.hm.tf==="1min"?"on":""}">1-min</button>
        <button data-v="5min" class="${state.hm.tf==="5min"?"on":""}">5-min</button>
        <button data-v="daily" class="${state.hm.tf==="daily"?"on":""}">Daily</button>
      </div></div>
    <button class="mini-btn ${state.hm.group?"on":""}" id="grpToggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/></svg>Group by sector</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">Advances</div><div class="v up">${adv}</div><div class="d">${tfLabel} · ${colorLabel}</div></div>
    <div class="stat"><div class="k">Declines</div><div class="v down">${dec}</div><div class="d">Unchanged ${unch}</div></div>
    <div class="stat"><div class="k">Universe</div><div class="v">${rows.length}</div><div class="d">${state.hm.universe} · ${state.hm.segment==="CASH"?"Cash":"F&O"}</div></div>
    <div class="stat"><div class="k">Breadth A/D</div><div class="v mono">${dec?fmt(adv/Math.max(dec,1),2):"—"}</div>
      <div class="breadth"><i style="width:${adv/rows.length*100}%;background:var(--up)"></i><i style="width:${unch/rows.length*100}%;background:var(--flat)"></i><i style="width:${dec/rows.length*100}%;background:var(--down)"></i></div></div>
  </div>

  <div class="hd"><h2>Sector Heat Map</h2><span class="sub">Tile size ∝ ${state.hm.size==="mcap"?"market cap":"equal weight"} · colour ∝ ${colorLabel.toLowerCase()} (${tfLabel})</span><div class="ln"></div>
    <div class="hm-legend"><span>−</span><i style="background:var(--hm-d5)"></i><i style="background:var(--hm-d3)"></i><i style="background:var(--flat)"></i><i style="background:var(--hm-u3)"></i><i style="background:var(--hm-u5)"></i><span>+</span></div>
  </div>
  <div id="heatmap"></div>`;
  VIEW.innerHTML='<div class="panel">'+html+'</div>';

  // wire controls
  VIEW.querySelectorAll('.segbar').forEach(sb=>{
    const g=sb.dataset.group;
    sb.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
      const v=btn.dataset.v;
      if(g==="universe")state.hm.universe=v;
      else if(g==="segment"){state.hm.segment=v;document.getElementById("segLabel").textContent="NSE · "+(v==="CASH"?"Cash":"F&O");}
      else if(g==="color")state.hm.color=v;
      else if(g==="size")state.hm.size=v;
      else if(g==="tf")state.hm.tf=v;
      renderHeatmap();
    }));
  });
  VIEW.querySelector('#grpToggle').addEventListener('click',()=>{state.hm.group=!state.hm.group;renderHeatmap();});

  // build tiles
  const container=VIEW.querySelector('#heatmap');
  const groups = state.hm.group ? groupBySector(rows) : [{sector:null,rows}];
  groups.forEach(g=>{
    const secEl=document.createElement('div');
    secEl.className='sector';
    const secAvg=g.rows.reduce((s,r)=>s+(state.hm.tf==="1min"?r.m1:state.hm.tf==="5min"?r.m5:r.dch),0)/g.rows.length;
    if(g.sector){
      secEl.innerHTML=`<div class="sector-hd"><span class="nm">${g.sector}</span><span class="ct">${g.rows.length} stocks</span><span class="ch ${pcCls(secAvg)}">${sign(secAvg)}%</span></div>`;
    }
    const tilesWrap=document.createElement('div');
    tilesWrap.className='tiles';
    secEl.appendChild(tilesWrap);
    container.appendChild(secEl);
    // layout after in DOM for width
    layoutTiles(tilesWrap,g.rows,colorScore);
  });
  // relayout on resize
  clearTimeout(window.__hmrt);
  window.addEventListener('resize',()=>{clearTimeout(window.__hmrt);window.__hmrt=setTimeout(()=>{if(currentView==="heatmap")renderHeatmap();},180);},{once:true});
}
function groupBySector(rows){
  const m={};rows.forEach(r=>{(m[r.sector]=m[r.sector]||[]).push(r)});
  return Object.entries(m).map(([sector,rs])=>({sector,rows:rs}))
    .sort((a,b)=>b.rows.reduce((s,r)=>s+r.mcap,0)-a.rows.reduce((s,r)=>s+r.mcap,0));
}
function layoutTiles(wrap,rows,colorScore){
  const W=wrap.clientWidth||wrap.getBoundingClientRect().width||600;
  // height proportional to content; more rows => taller, min 120
  const totalW=rows.reduce((s,r)=>s+sizeWeight(r),0);
  const H=Math.max(120,Math.min(360,Math.sqrt(rows.length)*((state.hm.group)?70:55)));
  wrap.style.height=H+"px";
  const items=rows.map(r=>({weight:sizeWeight(r),r}));
  squarify(items,0,0,W,H);
  items.forEach(it=>{
    const r=it.r,rc=it.rect;if(!rc)return;
    const dch=state.hm.tf==="1min"?r.m1:state.hm.tf==="5min"?r.m5:r.dch;
    const score=colorScore(r)*(dch>=0?1:(state.hm.color==="change"?1:-1));
    const col=hmColor(score,state.hm.color==="change"?"change":"rank");
    const el=document.createElement('div');
    el.className='tile'+((rc.w<46||rc.h<30)?' sm':'');
    el.style.left=rc.x+"px";el.style.top=rc.y+"px";el.style.width=rc.w+"px";el.style.height=rc.h+"px";
    el.style.background=col;el.style.color=textOn(dch);
    const fs=Math.max(8,Math.min(15,Math.min(rc.w/5,rc.h/3.2)));
    let metricTxt;
    if(state.hm.color==="change")metricTxt=sign(dch)+"%";
    else if(state.hm.color==="volume")metricTxt=volCompact(r.vol);
    else metricTxt="₹"+fmt0(r.tov)+"Cr";
    el.innerHTML=`<span class="sym" style="font-size:${fs}px">${r.sym}</span><span class="pc" style="font-size:${fs*0.82}px">${metricTxt}</span>`;
    el.title=`${r.sym}  ₹${fmt(r.px)}\nDaily ${sign(r.dch)}%  ·  1m ${sign(r.m1)}%  ·  5m ${sign(r.m5)}%\nVol ${volCompact(r.vol)}  ·  Turnover ₹${fmt0(r.tov)}Cr  ·  MCap ${compactCr(r.mcap)}`;
    wrap.appendChild(el);
  });
}

function sparkSVG(data,up){
  const w=140,h=40,mn=Math.min(...data),mx=Math.max(...data),rg=mx-mn||1;
  const pts=data.map((v,i)=>[i/(data.length-1)*w, h-4-((v-mn)/rg)*(h-8)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const col=up?"var(--up)":"var(--down)";
  const area=d+` L${w} ${h} L0 ${h} Z`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${up?'#16c784':'#ea3943'}" stop-opacity=".25"/><stop offset="1" stop-color="${up?'#16c784':'#ea3943'}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#g)"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6"/></svg>`;
}

function renderSettings(){
  let cards=API_DEFS.map(d=>{
    const a=CFG.apis[d.id];
    return `<div class="set-card" data-api="${d.id}">
      <div class="sh">
        <div class="ic" style="background:${d.color}22;color:${d.color}">${svgFor(d.id)}</div>
        <div><div class="nm">${d.name}</div><div class="ds">${d.ds}</div></div>
      </div>
      <div class="field"><label>Endpoint base URL</label>
        <input data-k="base" value="${a.base||""}" placeholder="${DEFAULT_BASE}" spellcheck="false"></div>
      <div class="field"><label>Access token</label>
        <input data-k="token" type="password" value="${a.token||""}" placeholder="paste ${d.id} access token" spellcheck="false"></div>
      <div class="note" style="font-size:10px">Functions: <code>${d.fns.split(" · ")[0]}</code> …</div>
      <div class="set-row"><button class="test-btn" data-test="${d.id}"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Test</button><span class="test-res" data-res="${d.id}"></span></div>
    </div>`;
  }).join("");

  VIEW.innerHTML=`<div class="panel">
    <div class="hd"><h2>API Keys &amp; Endpoints</h2><span class="sub">Each data class can use its own endpoint and token</span><div class="ln"></div></div>
    <div class="note" style="margin-bottom:14px">
      Enter a separate base URL and access token for each data class below — <b>Price</b>, <b>Fundamentals</b>, <b>Mutual Fund</b>, <b>IPO</b> and <b>News</b> can all point at different GFDL endpoints/subscriptions.
      Keys are stored only in this browser (<code>localStorage</code>) and are sent only to the endpoint you configure. Requests are fired as
      <code>{base}/{Function}/?params&amp;accesstoken={token}</code>. Live calls run when you open the <b>downloaded file</b> locally or self-host it (the published preview blocks cross-site calls).
    </div>
    <div class="set-grid">${cards}</div>

    <div class="hd" style="margin-top:20px"><h2>Preferences</h2><div class="ln"></div></div>
    <div class="set-grid">
      <div class="set-card">
        <div class="field"><label>Default exchange</label>
          <select id="prefExch" style="background:var(--bg);border:1px solid var(--border-2);border-radius:7px;color:var(--fg);padding:7px 10px;font-size:12px;font-family:var(--font-mono)">
            ${["NSE","BSE","NFO","MCX","NSE_IDX"].map(x=>`<option ${CFG.prefs.exchange===x?"selected":""}>${x}</option>`).join("")}
          </select></div>
        <div class="field"><label>Auto-refresh interval (seconds)</label>
          <input id="prefRefresh" type="number" min="5" value="${CFG.prefs.refresh}" style="font-family:var(--font-mono)"></div>
        <div class="set-row"><label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg);text-transform:none;letter-spacing:0;cursor:pointer">
          <input id="prefAuto" type="checkbox" ${CFG.prefs.autorefresh?"checked":""} style="width:16px;height:16px;accent-color:var(--accent)"> Enable auto-refresh</label></div>
      </div>
      <div class="set-card">
        <div class="sh"><div class="ic" style="background:#2f6bff22;color:var(--accent-2)">${svgFor("price")}</div>
          <div><div class="nm">Connection status</div><div class="ds">Per-class token presence</div></div></div>
        <div style="display:flex;flex-direction:column;gap:6px">${API_DEFS.map(d=>`<div style="display:flex;align-items:center;gap:8px;font-size:12px">
          <span class="dot ${hasToken(d.id)?'live':''}" style="width:8px;height:8px"></span>${d.name}
          <span style="margin-left:auto;font-size:10px;color:var(--faint)">${hasToken(d.id)?"token set":"not set"}</span></div>`).join("")}</div>
      </div>
    </div>

    <div class="save-bar">
      <button class="save-btn" id="saveCfg">Save settings</button>
      <button class="ghost-btn" id="resetCfg">Reset to defaults</button>
      <span class="test-res" id="saveMsg"></span>
    </div>
  </div>`;

  VIEW.querySelectorAll('[data-test]').forEach(b=>b.addEventListener('click',()=>testConn(b.dataset.test)));
  VIEW.querySelector('#saveCfg').addEventListener('click',()=>{
    API_DEFS.forEach(d=>{
      const card=VIEW.querySelector(`.set-card[data-api="${d.id}"]`);
      CFG.apis[d.id].base=card.querySelector('[data-k="base"]').value.trim()||DEFAULT_BASE;
      CFG.apis[d.id].token=card.querySelector('[data-k="token"]').value.trim();
    });
    CFG.prefs.exchange=VIEW.querySelector('#prefExch').value;
    CFG.prefs.refresh=Math.max(5,parseInt(VIEW.querySelector('#prefRefresh').value)||30);
    CFG.prefs.autorefresh=VIEW.querySelector('#prefAuto').checked;
    saveCfg(CFG);updateConn();
    const m=VIEW.querySelector('#saveMsg');m.textContent="✓ Saved";m.style.color="var(--up)";setTimeout(()=>m.textContent="",2500);
    renderTicker();
  });
  VIEW.querySelector('#resetCfg').addEventListener('click',()=>{
    try{localStorage.removeItem(CFG_KEY)}catch(e){}
    CFG=loadCfg();renderSettings();updateConn();
  });
}
function svgFor(id){
  const m={
    price:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 7-7"/><path d="M14 7h5v5"/></svg>',
    fundamental:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    mf:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>',
    ipo:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M7 8l5-5 5 5"/></svg>',
    news:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4zM8 9h8M8 13h6"/></svg>',
  };return m[id]||m.price;
}
async function testConn(api){
  const res=VIEW.querySelector(`[data-res="${api}"]`);
  const card=VIEW.querySelector(`.set-card[data-api="${api}"]`);
  // use the in-field values, not saved
  const base=card.querySelector('[data-k="base"]').value.trim()||DEFAULT_BASE;
  const token=card.querySelector('[data-k="token"]').value.trim();
  res.style.color="var(--muted)";res.textContent="testing…";
  const saved={...CFG.apis[api]};CFG.apis[api]={base,token};
  const probe={price:["GetServerInfo",{}],fundamental:["GetServerInfo",{}],mf:["GetServerInfo",{}],ipo:["GetServerInfo",{}],news:["GetServerInfo",{}]};
  try{
    await gfdl(api,probe[api][0],probe[api][1]);
    res.style.color="var(--up)";res.textContent="✓ reachable";
  }catch(e){
    res.style.color="var(--down)";
    res.textContent=/Failed to fetch|NetworkError|CSP|cors/i.test(e.message||"")?"✕ blocked here — run the downloaded file":"✕ "+(e.message||"unreachable");
  }finally{CFG.apis[api]=saved;}
}

/* ============================================================
   ticker + clock + status
   ============================================================ */
function renderTicker(){
  const items=SAMPLE_INDICES.map(ix=>`<span class="tk"><span class="nm">${ix.nm}</span><span class="px">${fmt(ix.px,2)}</span><span class="ch ${pcCls(ix.pc)}">${sign(ix.ch)} (${sign(ix.pc)}%)</span></span>`).join("");
  document.getElementById("tickTrack").innerHTML=items+items; // duplicate for seamless loop
}
function updateClock(){
  const d=new Date();
  const ist=d.toLocaleTimeString("en-GB",{timeZone:"Asia/Kolkata",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  document.getElementById("clock").textContent=ist+" IST";
}
function updateConn(){
  const dot=document.getElementById("connDot"),txt=document.getElementById("connText");
  if(liveEnabled()){dot.className="dot live";txt.textContent="Live mode ("+API_DEFS.filter(d=>hasToken(d.id)).length+"/5 keys)";}
  else{dot.className="dot";txt.textContent="Sample data";}
}

/* boot */
renderTicker();updateClock();updateConn();
setInterval(updateClock,1000);
document.getElementById("refreshAll").addEventListener("click",()=>{render();const b=document.getElementById("refreshAll");b.style.transform="rotate(360deg)";b.style.transition="transform .5s";setTimeout(()=>{b.style.transition="none";b.style.transform="none";},520);});
// honor hash on load
(function(){const h=(location.hash||"").replace("#","");if(h&&h!=="heatmap"){const b=document.querySelector('.nav-btn[data-view="'+h+'"]');if(b){document.querySelectorAll(".nav-btn").forEach(x=>x.classList.remove("on"));b.classList.add("on");currentView=h;}}})();
render();
</script>
